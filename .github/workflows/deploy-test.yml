name: Deploy test API

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eatable-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eatable-web" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.WEB_IMAGE_NAME }}:test
          build-args: |
            EXPO_PUBLIC_API_URL=https://srv58-20133.wykr.es
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image on VPS
        env:
          VPS_HOST: srv58.mikr.us
          VPS_USER: root
          VPS_PORT: "10133"
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/eatable-test'
          scp -P "$VPS_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes compose.test.yaml "$VPS_USER@$VPS_HOST:/opt/eatable-test/compose.test.yaml"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/eatable-test && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env && IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.test.yaml pull api web && IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.test.yaml up -d --remove-orphans --wait --wait-timeout 120"

      - name: Verify deployment endpoints
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://srv58-20133.wykr.es/health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --output /dev/null https://srv58-30133.wykr.es/
